# Local run like production: the app and PostgreSQL. http://localhost:3000, sign in as admin / editor / viewer.
services:
  app:
    build: .
    ports:
      - "3000:8080"
    environment:
      DASH_DB_DSN: postgres://dash:dash@db:5432/dash?sslmode=disable
      DASH_BASE_URL: http://localhost:3000
      DASH_SESSION_SECRET: local-only-session-secret-0123456789abcdef
      DASH_COOKIE_SECURE: "false"
      DASH_DEV_LOGIN: "true"
      DASH_SEED_DEMO: "true"
      DASH_DONATION_WEBHOOK_TOKEN: local-webhook-token
      # to try the real Forgejo sign-in, create an OAuth2 app with redirect
      # http://localhost:3000/auth/callback and set these:
      DASH_OAUTH_CLIENT_ID: ${DASH_OAUTH_CLIENT_ID:-}
      DASH_OAUTH_CLIENT_SECRET: ${DASH_OAUTH_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dash"]
      interval: 2s
      retries: 15

volumes:
  db:
